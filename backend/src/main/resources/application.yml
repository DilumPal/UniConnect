spring:
  application:
    name: uniconnect-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/uniconnect
    username: uniconnect
    password: uniconnect_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 1 day

supabase:
  s3:
    endpoint: ${SUPABASE_S3_ENDPOINT:https://your-project.supabase.co/storage/v1/s3}
    access-key: ${SUPABASE_ACCESS_KEY:your-access-key}
    secret-key: ${SUPABASE_SECRET_KEY:your-secret-key}
    bucket-name: ${SUPABASE_BUCKET_NAME:uniconnect-bucket}
    region: ${SUPABASE_REGION:auto}
